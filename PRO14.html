<div class="ef-box" id="quizBox">
  <h2>EV Quiz</h2>
  <div id="qCount"></div>
  <h3 id="question"></h3>
  <div id="options"></div>
  <button class="ef-btn" id="nextBtn" onclick="nextQuestion()">Next</button>
</div>

<footer>
  <p>Copyright 2026 by ecofleet Data. All Rights Reserved.</p>
</footer>

<script>
var questions = [
  { q: "What does EV stand for?", options: ["Electric Vehicle", "Energy Voltage", "Engine Valve"], answer: 0 },
  { q: "Which unit measures battery capacity?", options: ["Litre", "kWh", "Newton"], answer: 1 },
  { q: "Which vehicle has zero tailpipe emissions?", options: ["Diesel bus", "Petrol car", "Electric bus"], answer: 2 },
  { q: "What is a charging station used for?", options: ["Refuelling petrol", "Recharging batteries", "Washing cars"], answer: 1 }
];
var current = 0, score = 0;
function loadQuestion() {
  var item = questions[current];
  document.getElementById("qCount").textContent = "Question " + (current + 1) + " of " + questions.length;
  document.getElementById("question").textContent = item.q;
  var box = document.getElementById("options");
  box.innerHTML = "";
  item.options.forEach(function (text, i) {
    var b = document.createElement("button");
    b.className = "ef-opt";
    b.textContent = text;
    b.onclick = function () { checkAnswer(i, b); };
    box.appendChild(b);
  });
  document.getElementById("nextBtn").style.display = "none";
}
function checkAnswer(i, btn) {
  var correct = questions[current].answer;
  var all = document.querySelectorAll(".ef-opt");
  all.forEach(function (b) { b.disabled = true; });
  if (i == correct) { btn.classList.add("ok"); score++; }
  else { btn.classList.add("bad"); all[correct].classList.add("ok"); }
  document.getElementById("nextBtn").style.display = "inline-block";
}
function nextQuestion() {
  current++;
  if (current < questions.length) { loadQuestion(); return; }
  document.getElementById("quizBox").innerHTML =
    "<h2>Quiz complete</h2><p>Your score: " + score + " / " + questions.length + "</p>" +
    '<button class="ef-btn" onclick="location.reload()">Restart</button>';
}
loadQuestion();
</script>
